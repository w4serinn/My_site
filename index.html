<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>waserin</title>
  <link rel="stylesheet" href="{{BASE}}styles/tokens.css" />
</head>
<body>
  <!-- HEADER -->

  <main>
    <section id="about" class="about">
      <h1 class="about__name">waserin</h1>
      <!-- 本文は docs/ROADMAP.md 「1. トップページ：自己紹介」タスクでevolveループが構成を決め、
           実際のテキストはユーザーが後から入力する（content-pending）。
           SNSリンクは「3. 連絡先・SNSリンク」タスクのcontactセクションと重複するため
           自己紹介ブロックには含めない方針とした -->
      <p class="about__tagline">[要入力：肩書き・一言]</p>
      <p class="about__interests">[要入力：興味の方向性]</p>
    </section>

    <section id="works" class="works">
      <h2>Works</h2>
      <!-- カードのフォーマット：サムネ枠・タイトル・一言説明・リンクボタンの4要素構成。
           一言説明・マイン数独の公開URLは本文入力待ち（content-pending） -->
      <ul class="works-list">
        <li class="work-card">
          <div class="work-card__thumb" aria-hidden="true"></div>
          <h3 class="work-card__title">王立魔法学院アルノルド</h3>
          <p class="work-card__desc">[要入力：アルノルドの紹介文]</p>
          <a class="work-card__link" href="https://arnold-academy.com">サイトを見る</a>
        </li>
        <li class="work-card">
          <div class="work-card__thumb" aria-hidden="true"></div>
          <h3 class="work-card__title">マイン数独</h3>
          <p class="work-card__desc">[要入力：マイン数独の紹介文]</p>
          <a class="work-card__link" href="[要入力：マイン数独の公開URL]">サイトを見る</a>
        </li>
      </ul>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <!-- docs/ROADMAP.md 「3. 連絡先・SNSリンク」タスクでevolveループが枠を作る（content-pending） -->
      <p>[要入力：SNS/連絡先リンク]</p>
    </section>
  </main>

  <!-- FOOTER -->
  <script src="{{BASE}}src/main.js" type="module"></script>
